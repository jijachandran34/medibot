version: '3.9'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: kauvery
      POSTGRES_USER: kauvery
      POSTGRES_PASSWORD: kauvery_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kauvery"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py loaddata data/seed.json &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: dev-docker-secret-key
      DEBUG: "True"
      DATABASE_URL: postgresql://kauvery:kauvery_pass@db:5432/kauvery
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
